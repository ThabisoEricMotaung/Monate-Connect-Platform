<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AiForm Mining — Qualification Engine (Final Direction)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#1a3a2a;
    --gold:#c8a060;
    --gold-dark:#a9834a;
    --cream:#f0ebe0;
    --parchment:#f8f4ec;
    --ink:#22281f;
    --muted:#6b7568;
    --line:#e4ddcc;
    --red:#b3583f;
    --amber:#c08a2e;
    --green:#3d7a54;
    --white:#ffffff;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Libre Franklin', sans-serif;
    background:var(--parchment);
    color:var(--ink);
    padding:28px 32px 60px;
  }
  h1{font-family:'Playfair Display', serif; margin:0; color:var(--forest); font-size:26px; font-weight:700;}
  .sub{margin:4px 0 22px; color:var(--muted); font-size:13.5px; max-width:600px; line-height:1.5;}

  .filter-bar{
    display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;
  }
  .filter-bar button{
    font-family:'Libre Franklin', sans-serif;
    font-size:12.5px; font-weight:600;
    padding:7px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:var(--white);
    color:var(--muted);
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    transition:all .15s ease;
  }
  .filter-bar button .dot{width:7px; height:7px; border-radius:50%;}
  .filter-bar button[data-f="strong"] .dot{background:var(--green);}
  .filter-bar button[data-f="partial"] .dot{background:var(--amber);}
  .filter-bar button[data-f="weak"] .dot{background:var(--red);}
  .filter-bar button.active{
    background:var(--forest); color:var(--white); border-color:var(--forest);
  }
  .filter-bar button.active .dot{filter:brightness(1.4);}
  .filter-bar .count{
    font-size:11px; opacity:.8; margin-left:2px;
  }

  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-left:5px solid var(--gold);
    border-radius:10px;
    margin-bottom:12px;
    overflow:hidden;
    transition:border-color .15s ease;
    cursor:pointer;
  }
  .card.strong{border-left-color:var(--green);}
  .card.partial{border-left-color:var(--amber);}
  .card.weak{border-left-color:var(--red);}

  .card-row{
    display:flex;
    align-items:center;
    gap:18px;
    padding:16px 20px;
  }
  .card-main{flex:1; min-width:0;}
  .card-main .mine{
    font-size:11.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.03em; color:var(--gold-dark); margin-bottom:2px;
  }
  .card-main .title{font-size:16px; font-weight:700; color:var(--forest); margin-bottom:6px;}
  .card-main .meta{font-size:12.5px; color:var(--muted); display:flex; gap:14px; flex-wrap:wrap; margin-bottom:6px;}
  .card-main .flag{
    font-size:12.5px; font-weight:500; display:flex; align-items:center; gap:6px;
  }
  .flag.ok{color:var(--green);}
  .flag.partial{color:var(--amber);}
  .flag.weak{color:var(--red);}

  .card-right{text-align:center; width:96px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px;}
  .pct{font-family:'Playfair Display', serif; font-size:28px; font-weight:700; line-height:1;}
  .pct.strong{color:var(--green);}
  .pct.partial{color:var(--amber);}
  .pct.weak{color:var(--red);}
  .pct-label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}
  .chevron{
    font-size:11px; color:var(--muted);
    transition:transform .2s ease;
  }
  .card.open .chevron{transform:rotate(180deg);}

  .card-detail{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
    background:var(--cream);
    border-top:1px solid var(--line);
  }
  .card.open .card-detail{max-height:520px;}
  .card-detail-inner{padding:16px 24px 20px;}
  .group-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); margin-bottom:6px;}
  .req{
    display:flex; align-items:flex-start; gap:9px;
    font-size:13px; padding:5px 0; line-height:1.4;
  }
  .req .mark{width:16px; flex-shrink:0;}
  .icon-ok{color:var(--green);}
  .icon-warn{color:var(--amber);}
  .icon-fail{color:var(--muted);}
  .action-line{
    margin-top:14px; padding:11px 14px; background:var(--white); border:1px solid var(--line); border-radius:8px;
    font-size:12.5px; color:var(--ink); font-weight:500;
  }
</style>
</head>
<body>

<h1>Qualification Engine</h1>
<p class="sub">Default list rhythm, with the full requirement checklist expanding in place — one click, no page change. Filter bar gives the same grouping a board view offered, without splitting the screen into columns.</p>

<div class="filter-bar">
  <button class="active" data-f="all">All <span class="count">(4)</span></button>
  <button data-f="strong"><span class="dot"></span>Strong matches <span class="count">(2)</span></button>
  <button data-f="partial"><span class="dot"></span>Potentially eligible <span class="count">(1)</span></button>
  <button data-f="weak"><span class="dot"></span>Not qualified <span class="count">(1)</span></button>
</div>

<div id="cardList"></div>

<script>
const opportunities = [
  {
    tone:'strong', pct:92,
    mine:'Glencore — Tweefontein Colliery',
    title:'Electrical Contractor — Panel RFQ',
    meta:['Gauteng','Closes 4 Sep 2026','Engineering services'],
    flag:{tone:'ok', text:'Likely eligible — 1 item to watch'},
    reqs:[
      {label:'Based in Gauteng', state:'ok'},
      {label:'Engineering services category', state:'ok'},
      {label:'B-BBEE Level 1', state:'ok'},
      {label:'51%+ black ownership', state:'ok'},
      {label:'Tax compliant (SARS)', state:'ok'},
      {label:'COIDA registered', state:'ok'},
      {label:'Required mining experience (3+ years)', state:'ok'},
      {label:'Public liability insurance', state:'warn', note:'Expires in 23 days — renew before submission'},
    ],
    action:'Likely eligible. Renew public liability insurance before the 4 Sep closing date to avoid disqualification at award stage.'
  },
  {
    tone:'strong', pct:88,
    mine:'Impala Platinum — Rustenburg',
    title:'PPE Supply — Annual Tender',
    meta:['Limpopo','Closes 12 Sep 2026','Consumables'],
    flag:{tone:'ok', text:'Likely eligible — 1 item to watch'},
    reqs:[
      {label:'Based in Limpopo or supplying nationally', state:'ok'},
      {label:'B-BBEE Level 2 or better', state:'ok'},
      {label:'Tax compliant (SARS)', state:'ok'},
      {label:'ISO 9001 quality certification', state:'ok'},
      {label:'SABS product certification', state:'warn', note:'Certificate renewal due in 30 days'},
      {label:'Reference sites (2+)', state:'ok'},
    ],
    action:'Likely eligible. Start the SABS renewal now — a 30-day window is tight if there are any queries on the application.'
  },
  {
    tone:'partial', pct:71,
    mine:'Exxaro — Grootegeluk',
    title:'Earthmoving Equipment Supply',
    meta:['Mpumalanga','Closes 20 Sep 2026','Equipment'],
    flag:{tone:'partial', text:'Potentially eligible — 2 gaps'},
    reqs:[
      {label:'Based in Mpumalanga', state:'ok'},
      {label:'B-BBEE Level 1-4', state:'ok'},
      {label:'Tax compliant (SARS)', state:'ok'},
      {label:'Host-community supplier status', state:'fail', note:'Not yet verified — submit proof of local municipality residence'},
      {label:'2+ mining project references', state:'fail', note:'Only 1 reference on file — add a second before applying'},
      {label:'OEM equipment accreditation', state:'ok'},
    ],
    action:'Potentially eligible. Two gaps stand between you and a strong match — both are things you can fix before the 20 Sep closing date.'
  },
  {
    tone:'weak', pct:45,
    mine:'Sibanye-Stillwater — Kloof',
    title:'Engineering Services Panel',
    meta:['Free State','Closes 2 Oct 2026','Engineering services'],
    flag:{tone:'weak', text:'Not currently qualified — 3 gaps'},
    reqs:[
      {label:'Based in Free State', state:'ok'},
      {label:'Tax compliant (SARS)', state:'ok'},
      {label:'CIDB Grade 6CE or higher', state:'fail', note:'Currently graded 4CE — regrading takes 4-6 weeks'},
      {label:'ISO 9001 quality certification', state:'fail', note:'Not on file'},
      {label:'B-BBEE Level 4 or better', state:'fail', note:'Currently Level 6'},
    ],
    action:'Not currently qualified. Three structural gaps — CIDB regrading and B-BBEE improvement are multi-week efforts, so this is one to plan for future rounds rather than this cycle.'
  },
];

function iconFor(state){
  if(state==='ok') return '<span class="icon-ok">✓</span>';
  if(state==='warn') return '<span class="icon-warn">⚠</span>';
  return '<span class="icon-fail">✕</span>';
}

let activeFilter = 'all';

function render(){
  const list = document.getElementById('cardList');
  list.innerHTML = '';
  opportunities
    .filter(o => activeFilter === 'all' || o.tone === activeFilter)
    .forEach((o, idx) => {
      const card = document.createElement('div');
      card.className = 'card ' + o.tone;
      card.innerHTML = `
        <div class="card-row">
          <div class="card-main">
            <div class="mine">${o.mine}</div>
            <div class="title">${o.title}</div>
            <div class="meta">${o.meta.map(m=>`<span>${m}</span>`).join('')}</div>
            <div class="flag ${o.flag.tone}">${o.flag.tone==='ok'?'✓':o.flag.tone==='partial'?'⚠':'✕'} ${o.flag.text}</div>
          </div>
          <div class="card-right">
            <div class="pct ${o.tone}">${o.pct}%</div>
            <div class="pct-label">Match</div>
            <div class="chevron">▾</div>
          </div>
        </div>
        <div class="card-detail">
          <div class="card-detail-inner">
            <div class="group-label">Requirements</div>
            ${o.reqs.map(r => `
              <div class="req">
                <span class="mark">${iconFor(r.state)}</span>
                <span>${r.label}${r.note ? ' — <span style="color:var(--muted);">'+r.note+'</span>' : ''}</span>
              </div>
            `).join('')}
            <div class="action-line">${o.action}</div>
          </div>
        </div>
      `;
      card.querySelector('.card-row').addEventListener('click', () => {
        card.classList.toggle('open');
      });
      list.appendChild(card);
    });
}

document.querySelectorAll('.filter-bar button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filter-bar button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.f;
    render();
  });
});

render();
</script>

</body>
</html>
