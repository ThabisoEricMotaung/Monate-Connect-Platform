name: Lint, Type Check & Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint -- --max-warnings 0
        continue-on-error: false

      - name: Prettier check
        run: npx prettier --check .
        continue-on-error: false

      - name: TypeScript type check
        run: npm run typecheck
        continue-on-error: false

      - name: Run tests
        run: npm test
        continue-on-error: true

      - name: Build Next.js
        run: npm run build
        continue-on-error: false

  # Optional: Code coverage report
  coverage:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate coverage
        run: npm test -- --coverage
        continue-on-error: true
